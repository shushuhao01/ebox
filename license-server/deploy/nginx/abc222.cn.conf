# ============================================================
# eBox 授权服务平台 - Nginx 站点配置（域名 abc222.cn）
# ------------------------------------------------------------
# 适用场景：宝塔面板 或 原生 Nginx
#   - 宝塔：把本文件内容替换到「网站 -> abc222.cn -> 配置文件」，
#           或用宝塔自带的 SSL 证书后仅核对下方 location 与证书路径
#   - 原生：放入 /etc/nginx/conf.d/abc222.cn.conf 后 nginx -t && systemctl reload nginx
#
# 拓扑：https://abc222.cn  ->  Nginx  ->  127.0.0.1:3008 (Node/PM2)
#   - /        官网前台（website dist 静态）
#   - /admin/  管理后台（admin dist 静态）
#   - /api/    后端 API（客户端 /api/v1 与管理 /api/admin 统一反代），无需 CORS
#   注意：location /api/ 必须永久保留，老版本客户端只认 abc222.cn 的 /api/v1
# ============================================================

# ---------- HTTP(80) -> HTTPS(443) 跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name abc222.cn www.abc222.cn;

    # 客户端是 WinHTTP POST，不跟随 301 跳转，所以客户端必须直连 https；
    # 这里 80 跳转只服务浏览器访问，属于保底策略
    return 301 https://$host$request_uri;
}

# ---------- HTTPS(443) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name abc222.cn www.abc222.cn;

    # ---- 证书（宝塔 Let's Encrypt 默认路径；其他证书请自行修改）----
    ssl_certificate     /www/server/panel/vhost/cert/abc222.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/abc222.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（前端已配 history 路由，禁用自身嵌入）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 官网前台静态资源（默认根，前端 build 产物）----
    root /www/wwwroot/license-server/website/dist;
    index index.html;

    # 官网前台 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 的构建产物）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 管理后台静态资源（独立目录，必须用 alias 指向后台 dist）----
    location /admin/ {
        alias /www/wwwroot/license-server/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 后端 API 反代（客户端 + 管理接口统一走 /api）----
    location /api/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # 生成激活码等大请求可能耗时较长，与前端 axios 120s 超时对齐
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 官网管理端图片上传（后端限制 10MB），此处需同步放宽，否则大图会 413
        client_max_body_size 10m;
    }

    # 健康检查直通
    location = /health {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 访问日志 ----
    access_log /www/wwwlogs/abc222.cn.log;
    error_log  /www/wwwlogs/abc222.cn.error.log;
}
